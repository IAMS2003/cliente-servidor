# Configuracion de red del cliente para conectarse al servidor
# Este archivo se usa cuando ejecutas con: mvn javafx:run
# Para produccion, coloca este archivo junto al JAR

# IP del servidor (cambia esto segun tu red)
chat.server.host=192.168.1.132
chat.server.port=8081

# Tiempo maximo (segundos) para esperar respuestas
chat.timeout.seconds=10
