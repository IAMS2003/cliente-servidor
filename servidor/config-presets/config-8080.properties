# Preset: Servidor A (puerto 8080)
server.host=192.168.1.132
server.port=8080

p2p.enabled=true
p2p.port=9090
# Sin peers, actuará como semilla local
p2p.peers=

# Base de datos (puedes cambiar a otro schema si prefieres)
jdbc.url=jdbc:mysql://localhost:3306/chat_servidor?connectTimeout=3000&socketTimeout=5000
jdbc.user=root
jdbc.password=root

# Pool
db.maxPoolSize=10
db.minIdle=2
db.connectionTimeoutMs=5000
db.idleTimeoutMs=600000
db.maxLifetimeMs=1800000
